[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "olca_schema"
version = "2.7.0"
description = "A package for reading and writing data sets in the openLCA schema format."
readme = "README.md"
requires-python = ">=3.12"
keywords=["openLCA", "life cycle assessment", "LCA"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: File Formats :: JSON",
]

[project.urls]
"Homepage" = "https://github.com/GreenDelta/olca-schema"
"Bug Tracker" = "https://github.com/GreenDelta/olca-schema/issues"

[tool.setuptools.packages.find]
include = ["olca_schema", "olca_schema.units"]
exclude = ["tests"]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
]
packaging = [
    "build>=1.4",
    "twine>=6.2",
]
